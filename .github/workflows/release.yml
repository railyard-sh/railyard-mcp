name: Release

# Publishing a GitHub release (tag vX.Y.Z, matching package.json) publishes that version to npm
# through npm trusted publishing (OIDC: no long-lived npm token) with a signed provenance
# statement, and attaches the Claude Desktop bundle (.mcpb) with SHA256SUMS and a signed build
# attestation to the release. Every third-party action is pinned to a full commit SHA.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - name: Check the tag matches package.json and manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          manifest="$(node -p 'require("./manifest.json").version')"
          test "$TAG" = "v$version" || { echo "::error::Tag $TAG does not match package.json version $version"; exit 1; }
          test "$manifest" = "$version" || { echo "::error::manifest.json version $manifest does not match $version"; exit 1; }
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Enforce line coverage
        run: npm run test:coverage
      - name: Type-check
        run: npm run typecheck
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  npm:
    name: Publish to npm with provenance
    needs: verify
    runs-on: ubuntu-latest
    # Add protection rules (required reviewers) to this environment to gate every publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing and provenance need
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or later).
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }
          ' "$(npm --version)"
      - name: Install locked dependencies
        run: npm ci
      - name: Publish
        run: npm publish --provenance --access public

  bundle:
    name: Attach the desktop bundle and checksums
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install locked dependencies and build
        run: npm ci
      - name: Keep only runtime dependencies
        run: npm prune --omit=dev
      - name: Pack the bundle
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "railyard-mcp-${TAG#v}.mcpb"
          sha256sum "railyard-mcp-${TAG#v}.mcpb" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest the bundle's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "railyard-mcp-${TAG#v}.mcpb" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
